<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Boliyapur Admin</title><link rel="stylesheet" href="community.css"><style>body{font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f5f8f6;color:#17251e;margin:0}.wrap{width:min(900px,92%);margin:35px auto}.panel{background:white;border:1px solid #e1e9e4;border-radius:16px;padding:22px;margin:16px 0}.field{display:block;width:100%;padding:12px;margin:8px 0;border:1px solid #dce6df;border-radius:9px;box-sizing:border-box;font:inherit}.btn{padding:10px 15px;border:0;border-radius:9px;background:#198754;color:white;font-weight:700;cursor:pointer;margin:5px}.danger{background:#a83225}.post{border:1px solid #dce6df;padding:15px;border-radius:12px;margin:12px 0}.post img,.post video{max-width:100%;max-height:300px;display:block}.muted{color:#68776e}.hidden{display:none}</style></head>
<body><main class="wrap"><h1>বলিয়াপুর নাগরিক পোর্টাল — Admin</h1><p class="muted">শুধু অনুমোদিত Admin অ্যাকাউন্ট দিয়ে প্রবেশ করুন।</p>
<section class="panel" id="loginPanel"><h2>Admin লগইন</h2><input class="field" id="email" type="email" placeholder="Admin email"><input class="field" id="password" type="password" placeholder="Password"><button class="btn" id="login">লগইন</button><p id="loginStatus" role="status"></p></section>
<section class="panel hidden" id="dashboard"><h2>অপেক্ষমাণ পোস্ট</h2><p id="adminStatus" class="muted"></p><button class="btn" id="logout">লগআউট</button><div id="pendingList"></div></section></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,query,where,orderBy,onSnapshot,updateDoc,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const $=id=>document.getElementById(id);let stop=null;
if(firebaseConfig.apiKey.includes("PASTE_"))$("loginStatus").textContent="প্রথমে firebase-config.js-এ Firebase Web App config বসান।";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
$("login").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value);$("loginStatus").textContent="লগইন সফল";}catch(e){$("loginStatus").textContent="লগইন হয়নি: "+e.message;}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{
 $("loginPanel").classList.toggle("hidden",!!user);$("dashboard").classList.toggle("hidden",!user);
 if(stop){stop();stop=null;}
 if(!user)return;
 $("adminStatus").textContent="লগইন UID: "+user.uid+" — Rules-এ এই UID-টি Admin UID হিসেবে সেট করুন।";
 const q=query(collection(db,"communityPosts"),where("status","==","pending"),orderBy("createdAt","desc"));
 stop=onSnapshot(q,snap=>{
  $("pendingList").innerHTML=snap.empty?"<p>কোনো অপেক্ষমাণ পোস্ট নেই।</p>":snap.docs.map(d=>{
   const p=d.data(),media=p.mediaUrl?(p.mediaType==="video"?'<video controls src="'+p.mediaUrl+'"></video>':'<img src="'+p.mediaUrl+'" alt="জমা দেওয়া ছবি">'):"";
   return '<article class="post"><h3>'+esc(p.title)+'</h3>'+media+'<p>'+esc(p.story)+'</p><p class="muted">নাম: '+esc(p.authorName)+' · এলাকা: '+esc(p.area)+' · বিভাগ: '+esc(p.category)+'</p><button class="btn" data-approve="'+d.id+'">Approve / প্রকাশ</button><button class="btn danger" data-delete="'+d.id+'">Delete</button></article>';
  }).join("");
 });
});
$("pendingList").onclick=async e=>{
 const a=e.target.closest("[data-approve]"),d=e.target.closest("[data-delete]");
 try{if(a)await updateDoc(doc(db,"communityPosts",a.dataset.approve),{status:"approved",approvedAt:new Date()});
 if(d&&confirm("এই পোস্টটি স্থায়ীভাবে মুছে ফেলবেন?"))await deleteDoc(doc(db,"communityPosts",d.dataset.delete));}
 catch(err){alert("কাজটি করা যায়নি: "+err.message);}
};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script></body></html>
